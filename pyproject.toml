[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-kit"
version = "0.1.0"
description = "Foundation for the research-kit personal research monorepo: spec-driven construction (core.spine) and run provenance (labkit)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aayushman Ghatak" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[project.scripts]
labkit = "research_kit.labkit.cli:main"
research-spine = "research_kit.core.spine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that shell out to external tools (deselect with '-m \"not slow\"')",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# In tests, nested `with pytest.raises(...): with cm():` and nested `if` guards
# read more clearly than the combined forms.
"tests/**" = ["SIM117", "SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/research_kit"]
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[[tool.mypy.overrides]]
# Optional heavyweight backends: imported lazily, never a hard dependency, and
# not type-checked here.
module = ["torch", "torch.*", "numpy", "numpy.*"]
ignore_missing_imports = true
